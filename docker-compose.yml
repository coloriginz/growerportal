services:
  postgres:
    image: postgres:16-alpine
    container_name: growerportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: growerportal
      POSTGRES_PASSWORD: growerportal
      POSTGRES_DB: growerportal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
